# upstreams-green.conf
# Green stack containers are named with the "green" compose project prefix.
# Internal ports are identical — the offset only applies to host-exposed ports
# (used during health-check validation before cutover, not by nginx).

upstream order_service        { server green-order-service-1:8082; }
upstream restaurant_service   { server green-restaurant-service-1:8081; }
upstream delivery_service     { server green-delivery-service-1:8083; }
upstream eta_service          { server green-eta-service-1:8084; }
upstream assignment_service   { server green-assignment-service-1:8085; }
upstream notification_service { server green-notification-service-1:8086; }
upstream ops_dashboard        { server green-ops-dashboard-1:3000; }
