# upstreams-blue.conf
# Blue stack containers are named with the "blue" compose project prefix.
# Internal ports match the service's native port (no offset needed inside Docker network).

upstream order_service        { server blue-order-service-1:8082; }
upstream restaurant_service   { server blue-restaurant-service-1:8081; }
upstream delivery_service     { server blue-delivery-service-1:8083; }
upstream eta_service          { server blue-eta-service-1:8084; }
upstream assignment_service   { server blue-assignment-service-1:8085; }
upstream notification_service { server blue-notification-service-1:8086; }
upstream ops_dashboard        { server blue-ops-dashboard-1:3000; }
