# nginx.conf — Blue-Green proxy for food-delivery-platform
# The active upstream set is controlled by the symlink:
#   /etc/nginx/conf.d/active-upstreams.conf -> upstreams-blue.conf | upstreams-green.conf
# Cutover = update the symlink + nginx -s reload (zero-downtime graceful reload)

worker_processes auto;
error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout combined;

    # ── Upstream definitions (swapped at cutover) ────────────────────────────
    # Loaded from the active-upstreams.conf symlink inside conf.d/
    include /etc/nginx/conf.d/active-upstreams.conf;

    # ── order-service  :8082 ─────────────────────────────────────────────────
    server {
        listen 8082;
        location / {
            proxy_pass         http://order_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    # ── restaurant-service  :8081 ────────────────────────────────────────────
    server {
        listen 8081;
        location / {
            proxy_pass         http://restaurant_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    # ── delivery-service  :8083 ──────────────────────────────────────────────
    server {
        listen 8083;
        location / {
            proxy_pass         http://delivery_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    # ── eta-service  :8084 ───────────────────────────────────────────────────
    server {
        listen 8084;
        location / {
            proxy_pass         http://eta_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    # ── assignment-service  :8085 ────────────────────────────────────────────
    server {
        listen 8085;
        location / {
            proxy_pass         http://assignment_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    # ── notification-service  :8086 ──────────────────────────────────────────
    server {
        listen 8086;
        location / {
            proxy_pass         http://notification_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }

    # ── ops-dashboard  :3000 ─────────────────────────────────────────────────
    server {
        listen 3000;
        location / {
            proxy_pass         http://ops_dashboard;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
