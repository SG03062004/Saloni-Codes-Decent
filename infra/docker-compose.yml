version: "3.9"

# All containers join delivery-net so every service can reach every other
# service by its compose service name (e.g. http://order-service:8082).
networks:
  delivery-net:
    driver: bridge

volumes:
  mysql-data:

services:

  # ── MySQL 8 ────────────────────────────────────────────────────────────────
  # Spatial extensions (GEOMETRY, POINT, SPATIAL INDEX, ST_Distance_Sphere)
  # are built-in to MySQL 8 — no extra plugin or flag needed.

  mysql:
    image: mysql:8.0
    networks: [delivery-net]
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────────
  # apache/kafka:3.7.0 ships with KRaft built-in.
  # KAFKA_PROCESS_ROLES=broker,controller runs both roles in one container,
  # which is correct for a single-node dev setup.
  # CLUSTER_ID must be a valid base64-encoded 16-byte UUID — generate once with:
  #   docker run --rm apache/kafka:3.7.0 /opt/kafka/bin/kafka-storage.sh random-uuid

  kafka:
    image: apache/kafka:3.7.0
    networks: [delivery-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Ops Dashboard ──────────────────────────────────────────────────────────

  ops-dashboard:
    build: ../services/ops-dashboard
    networks: [delivery-net]
    ports:
      - "3000:3000"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      # Comma-separated name=url pairs — ops-dashboard /status fans out to these.
      # Java services expose /actuator/health; Python + Node expose /health.
      SERVICE_URLS: >-
        restaurant-service=http://restaurant-service:8081/actuator/health,
        order-service=http://order-service:8082/actuator/health,
        delivery-service=http://delivery-service:8083/actuator/health,
        eta-service=http://eta-service:8084/health,
        assignment-service=http://assignment-service:8085/health,
        notification-service=http://notification-service:8086/health

  # ── App service placeholders (uncomment as each service is built) ──────────
  # Each block is ready to go — just remove the leading # characters.
  # healthcheck paths: Java → /actuator/health, Python/Node → /health

  restaurant-service:
    build: ../services/restaurant-service
    networks: [delivery-net]
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/restaurant_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  order-service:
    build: ../services/order-service
    networks: [delivery-net]
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  delivery-service:
    build: ../services/delivery-service
    networks: [delivery-net]
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/delivery_db
      DB_USER: root
      DB_PASS: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s

  eta-service:
    build: ../services/eta-service
    networks: [delivery-net]
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  notification-service:
    build: ../services/notification-service
    networks: [delivery-net]
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: mysql+aiomysql://root:root@mysql:3306/notification_db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  assignment-service:
    build: ../services/assignment-service
    networks: [delivery-net]
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: mysql+aiomysql://root:root@mysql:3306/assignment_db
      ETA_SERVICE_URL: http://eta-service:8084
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
