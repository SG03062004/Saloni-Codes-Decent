<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Delivery — Ops Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; padding: 24px; }
    h1   { font-size: 1.4rem; font-weight: 600; margin-bottom: 20px; color: #f8fafc; }
    h2   { font-size: 1rem; font-weight: 500; margin-bottom: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; }

    /* Status tiles */
    #tiles { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 32px; }
    .tile  {
      background: #1e2330; border-radius: 10px; padding: 16px 20px;
      min-width: 160px; border-left: 4px solid #334155;
      transition: border-color .3s;
    }
    .tile.UP   { border-color: #22c55e; }
    .tile.DOWN { border-color: #ef4444; }
    .tile .svc { font-size: .8rem; color: #94a3b8; margin-bottom: 4px; }
    .tile .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: #64748b; }
    .tile.UP   .dot { background: #22c55e; }
    .tile.DOWN .dot { background: #ef4444; }
    .tile .badge { font-size: 1rem; font-weight: 700; }
    .tile .meta  { font-size: .72rem; color: #64748b; margin-top: 6px; }

    /* Charts grid */
    .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .card   { background: #1e2330; border-radius: 10px; padding: 20px; }
    canvas  { max-height: 200px; }

    /* Funnel */
    #funnel-bars { display: flex; flex-direction: column; gap: 10px; }
    .funnel-row  { display: flex; align-items: center; gap: 12px; }
    .funnel-label{ width: 140px; font-size: .82rem; color: #94a3b8; text-align: right; }
    .funnel-bar-wrap { flex: 1; background: #2d3748; border-radius: 4px; height: 22px; overflow: hidden; }
    .funnel-bar  { height: 100%; background: #3b82f6; border-radius: 4px; transition: width .5s; min-width: 2px; }
    .funnel-count{ font-size: .82rem; color: #e2e8f0; width: 40px; }

    #last-updated { font-size: .75rem; color: #475569; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🚀 Food Delivery — Ops Dashboard</h1>

  <h2>Service Health</h2>
  <div id="tiles"></div>

  <h2>Metrics — Last Hour</h2>
  <div class="charts">
    <div class="card"><canvas id="chart-requests"></canvas></div>
    <div class="card"><canvas id="chart-errors"></canvas></div>
    <div class="card"><canvas id="chart-latency"></canvas></div>
  </div>

  <h2>Order Funnel</h2>
  <div class="card" style="max-width:640px">
    <div id="funnel-bars"></div>
  </div>

  <div id="last-updated"></div>

<script>
const COLORS = ['#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899','#14b8a6'];
const REFRESH_MS = 10_000;

// ── Chart helpers ────────────────────────────────────────────────────────────

function makeLineChart(id, label, color) {
  return new Chart(document.getElementById(id), {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true,
      animation: false,
      plugins: { legend: { labels: { color: '#94a3b8', boxWidth: 12 } },
                 title:  { display: true, text: label, color: '#cbd5e1' } },
      scales: {
        x: { ticks: { color: '#475569', maxTicksLimit: 6 }, grid: { color: '#1e293b' } },
        y: { ticks: { color: '#475569' }, grid: { color: '#1e293b' }, beginAtZero: true },
      },
    },
  });
}

const charts = {
  requests: makeLineChart('chart-requests', 'Request Count',    '#3b82f6'),
  errors:   makeLineChart('chart-errors',   'Error Count',      '#ef4444'),
  latency:  makeLineChart('chart-latency',  'Avg Latency (ms)', '#f59e0b'),
};

// ── Tiles ────────────────────────────────────────────────────────────────────

function renderTiles(rows) {
  const el = document.getElementById('tiles');
  el.innerHTML = rows.map(r => `
    <div class="tile ${r.status}">
      <div class="svc">${r.service_name}</div>
      <div class="badge"><span class="dot"></span>${r.status}</div>
      <div class="meta">
        req: ${r.request_count} &nbsp;|&nbsp;
        err: ${r.error_count} &nbsp;|&nbsp;
        p50: ${Number(r.avg_latency_ms).toFixed(1)}ms
      </div>
    </div>`).join('');
}

// ── Trend charts ─────────────────────────────────────────────────────────────

function renderCharts(rows) {
  // Group by service
  const byService = {};
  for (const r of rows) {
    (byService[r.service_name] = byService[r.service_name] || []).push(r);
  }

  // Collect all unique timestamps (x-axis)
  const allTimes = [...new Set(rows.map(r => r.captured_at))].sort();
  const labels   = allTimes.map(t => new Date(t).toLocaleTimeString());

  const services = Object.keys(byService);

  for (const [key, field] of [['requests','request_count'],['errors','error_count'],['latency','avg_latency_ms']]) {
    const chart = charts[key];
    chart.data.labels = labels;
    chart.data.datasets = services.map((svc, i) => {
      const snapMap = Object.fromEntries(byService[svc].map(r => [r.captured_at, r[field]]));
      return {
        label:           svc,
        data:            allTimes.map(t => snapMap[t] ?? null),
        borderColor:     COLORS[i % COLORS.length],
        backgroundColor: COLORS[i % COLORS.length] + '22',
        tension:         0.3,
        spanGaps:        true,
        pointRadius:     2,
      };
    });
    chart.update();
  }
}

// ── Funnel ───────────────────────────────────────────────────────────────────

function renderFunnel(data) {
  const max = Math.max(...data.map(d => d.count), 1);
  document.getElementById('funnel-bars').innerHTML = data.map(d => `
    <div class="funnel-row">
      <div class="funnel-label">${d.status}</div>
      <div class="funnel-bar-wrap">
        <div class="funnel-bar" style="width:${(d.count / max * 100).toFixed(1)}%"></div>
      </div>
      <div class="funnel-count">${d.count}</div>
    </div>`).join('');
}

// ── Refresh ──────────────────────────────────────────────────────────────────

async function refresh() {
  try {
    const [status, snapshots, funnel] = await Promise.all([
      fetch('/api/status').then(r => r.json()),
      fetch('/api/snapshots').then(r => r.json()),
      fetch('/api/funnel').then(r => r.json()),
    ]);
    renderTiles(status);
    renderCharts(snapshots);
    renderFunnel(funnel);
    document.getElementById('last-updated').textContent =
      'Last updated: ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('refresh error', e);
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
