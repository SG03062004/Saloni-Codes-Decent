spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:mysql://mysql:3306/delivery_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: delivery-service-group
      auto-offset-reset: earliest

server:
  port: 8083
