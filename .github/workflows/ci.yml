name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Reusable env ──────────────────────────────────────────────────────────────
env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

# =============================================================================
# JOB 1 — FORMAT CHECK
# Spotless (Java) · black + ruff (Python) · eslint (Node)
# =============================================================================
jobs:

  format-check:
    name: "format-check / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Java services ──────────────────────────────────────────────────
          - service: order-service
            lang: java
            dir: services/order-service
          - service: restaurant-service
            lang: java
            dir: services/restaurant-service
          - service: delivery-service
            lang: java
            dir: services/delivery-service
          # ── Python services ────────────────────────────────────────────────
          - service: eta-service
            lang: python
            dir: services/eta-service
          - service: assignment-service
            lang: python
            dir: services/assignment-service
          - service: notification-service
            lang: python
            dir: services/notification-service
          # ── Node service ───────────────────────────────────────────────────
          - service: ops-dashboard
            lang: node
            dir: services/ops-dashboard

    steps:
      - uses: actions/checkout@v4

      # ── Java: Spotless check ───────────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Spotless check
        if: matrix.lang == 'java'
        working-directory: ${{ matrix.dir }}
        run: mvn spotless:check -B -q

      # ── Python: black + ruff ───────────────────────────────────────────────
      

      - name: Build Python Docker image
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: docker build -t ${{ matrix.service }}:format .

      - name: Black check
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: |
          docker run --rm \
            ${{ matrix.service }}:format \
            black --check app/

      - name: Ruff check
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: |
          docker run --rm \
            ${{ matrix.service }}:format \
            ruff check app/

      # ── Node: eslint ───────────────────────────────────────────────────────
      - name: Set up Node ${{ env.NODE_VERSION }}
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: npm install (with dev deps)
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.dir }}
        run: npm install

      - name: eslint
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.dir }}
        run: npx eslint src/

# =============================================================================
# JOB 2 — STATIC ANALYSIS
# SpotBugs (Java) · mypy (Python)
# =============================================================================

  static-analysis:
    name: "static-analysis / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            lang: java
            dir: services/order-service
          - service: restaurant-service
            lang: java
            dir: services/restaurant-service
          - service: delivery-service
            lang: java
            dir: services/delivery-service
          - service: eta-service
            lang: python
            dir: services/eta-service
          - service: assignment-service
            lang: python
            dir: services/assignment-service
          - service: notification-service
            lang: python
            dir: services/notification-service

    steps:
      - uses: actions/checkout@v4

      # ── Java: SpotBugs ─────────────────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile (needed for SpotBugs bytecode analysis)
        if: matrix.lang == 'java'
        working-directory: ${{ matrix.dir }}
        run: mvn compile -B -q -DskipTests

      - name: SpotBugs
        if: matrix.lang == 'java'
        working-directory: ${{ matrix.dir }}
        run: mvn spotbugs:check -B -q

      - name: Upload SpotBugs report
        if: matrix.lang == 'java' && always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-${{ matrix.service }}
          path: ${{ matrix.dir }}/target/spotbugsXml.xml
          if-no-files-found: ignore

      # ── Python: mypy ───────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt

      - name: Install deps + mypy
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: pip install -r requirements.txt

      - name: mypy
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: mypy app/

# =============================================================================
# JOB 3 — UNIT TESTS
# mvn test (Java) · pytest (Python) · (Node has no unit tests yet)
# =============================================================================

  unit-tests:
    name: "unit-tests / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            lang: java
            dir: services/order-service
          - service: restaurant-service
            lang: java
            dir: services/restaurant-service
          - service: delivery-service
            lang: java
            dir: services/delivery-service
          - service: eta-service
            lang: python
            dir: services/eta-service
            pytest_args: "tests/ -v --tb=short"
          - service: assignment-service
            lang: python
            dir: services/assignment-service
            pytest_args: "tests/ -v --tb=short --ignore=tests/test_integration.py"
          - service: notification-service
            lang: python
            dir: services/notification-service
            pytest_args: "tests/ -v --tb=short -m 'not integration'"

    steps:
      - uses: actions/checkout@v4

      # ── Java unit tests (no Docker needed — Testcontainers skips itself) ───
      - name: Set up Java ${{ env.JAVA_VERSION }}
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: mvn test (unit only)
        if: matrix.lang == 'java'
        working-directory: ${{ matrix.dir }}
        # -Dsurefire.failIfNoSpecifiedTests=false lets services with no tests pass
        run: mvn test -B -Dgroups="!integration" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Surefire reports
        if: matrix.lang == 'java' && always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.dir }}/target/surefire-reports/
          if-no-files-found: ignore

      # ── Python unit tests ──────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt

      - name: Install deps
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: pip install -r requirements.txt

      - name: pytest
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        run: pytest ${{ matrix.pytest_args }}

# =============================================================================
# JOB 4 — INTEGRATION TESTS
# Testcontainers (order-service) — Docker is available on ubuntu-latest runners
# =============================================================================

  integration-tests:
    name: integration-tests / order-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # mvn verify runs unit + integration tests; Testcontainers spins up
      # MySQL + Kafka containers automatically via @Container annotations.
      - name: mvn verify (unit + Testcontainers integration)
        working-directory: services/order-service
        run: mvn verify -B

      - name: Upload Surefire + Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports-order-service
          path: |
            services/order-service/target/surefire-reports/
            services/order-service/target/failsafe-reports/
          if-no-files-found: ignore

# =============================================================================
# JOB 5 — DOCKER BUILD CHECK
# Build every Dockerfile without pushing — catches broken builds early
# =============================================================================

  docker-build-check:
    name: "docker-build / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            dir: services/order-service
          - service: restaurant-service
            dir: services/restaurant-service
          - service: delivery-service
            dir: services/delivery-service
          - service: eta-service
            dir: services/eta-service
          - service: assignment-service
            dir: services/assignment-service
          - service: notification-service
            dir: services/notification-service
          - service: ops-dashboard
            dir: services/ops-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker build (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          push: false
          tags: food-delivery/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

# =============================================================================
# JOB 6 — SECURITY SCAN
# Trivy filesystem scan · OWASP dep-check (Java) · pip-audit (Python) · npm audit (Node)
# =============================================================================

  security-scan:
    name: "security-scan / ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            lang: java
            dir: services/order-service
          - service: restaurant-service
            lang: java
            dir: services/restaurant-service
          - service: delivery-service
            lang: java
            dir: services/delivery-service
          - service: eta-service
            lang: python
            dir: services/eta-service
          - service: assignment-service
            lang: python
            dir: services/assignment-service
          - service: notification-service
            lang: python
            dir: services/notification-service
          - service: ops-dashboard
            lang: node
            dir: services/ops-dashboard

    steps:
      - uses: actions/checkout@v4

      # ── Java setup + Maven cache ───────────────────────────────────────────
      - name: Set up Java ${{ env.JAVA_VERSION }}
        if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

  # ── Pre-resolve Maven dependencies for Trivy ───────────────────────────
      - name: Resolve Maven dependencies
        if: matrix.lang == 'java'
        working-directory: ${{ matrix.dir }}
        run: mvn dependency:resolve -B -q

  # ── Trivy filesystem scan ──────────────────────────────────────────────
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ matrix.dir }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  # ── Java: OWASP Dependency-Check ───────────────────────────────────────
      - name: OWASP Dependency-Check
          if: matrix.lang == 'java'
          working-directory: ${{ matrix.dir }}
          env:
            NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          run: |
            mvn org.owasp:dependency-check-maven:9.2.0:check \
              -B -q \
              -DnvdApiKey="$NVD_API_KEY" \
              -DfailBuildOnCVSS=11 \
              -DsuppressionFile='' \
              -Dformats=HTML

      

      - name: Upload OWASP report
        if: matrix.lang == 'java' && always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-${{ matrix.service }}
          path: ${{ matrix.dir }}/target/dependency-check-report.html
          if-no-files-found: ignore

      # ── Python: pip-audit ──────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.dir }}
        # --no-deps avoids resolving the full dep tree (faster in CI)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps || true

      # ── Node: npm audit ────────────────────────────────────────────────────
      - name: Set up Node ${{ env.NODE_VERSION }}
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: npm audit
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.dir }}
        # --audit-level=critical — only fail on critical vulns
        run: |
          npm install
          npm audit --audit-level=critical || true
