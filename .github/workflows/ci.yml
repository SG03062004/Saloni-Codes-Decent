name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same branch/PR so pushes don't queue up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── order-service (Java / Spring Boot) ──────────────────────────────────────
  order-service:
    name: order-service — build & test
    runs-on: ubuntu-latest
    # Only run when order-service files change (or workflow itself changes)
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'services/order-service')
    defaults:
      run:
        working-directory: services/order-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & test
        run: mvn verify -B
        # Testcontainers integration tests are skipped automatically when
        # Docker is unavailable (disabledWithoutDocker = true). Unit tests
        # always run. On GitHub Actions, Docker IS available so the
        # integration tests will run here.

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-service-surefire
          path: services/order-service/target/surefire-reports/

  # ── restaurant-service (Java / Spring Boot) ─────────────────────────────────
  restaurant-service:
    name: restaurant-service — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/restaurant-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build (no tests yet)
        run: mvn package -DskipTests -B

  # ── delivery-service (Java / Spring Boot) ───────────────────────────────────
  delivery-service:
    name: delivery-service — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/delivery-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build (no tests yet)
        run: mvn package -DskipTests -B

  # ── eta-service (Python / FastAPI) ──────────────────────────────────────────
  eta-service:
    name: eta-service — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/eta-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/eta-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── assignment-service (Python / FastAPI) ───────────────────────────────────
  assignment-service:
    name: assignment-service — install check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/assignment-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/assignment-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

  # ── ops-dashboard (Node / Express) ──────────────────────────────────────────
  ops-dashboard:
    name: ops-dashboard — install check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ops-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/ops-dashboard/package.json

      - name: Install dependencies
        run: npm install --omit=dev

  # ── Docker Compose smoke test (main branch only) ─────────────────────────────
  # Brings up MySQL + Kafka (infra only — app services commented out in compose)
  # and verifies both reach healthy state within the timeout.
  smoke-test:
    name: infra smoke test
    runs-on: ubuntu-latest
    needs: [order-service, eta-service, ops-dashboard]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Start infra containers
        run: docker compose up -d mysql kafka ops-dashboard

      - name: Wait for MySQL healthy
        run: |
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' infra-mysql-1 2>/dev/null || echo "starting")
            echo "MySQL status: $STATUS (attempt $i)"
            [ "$STATUS" = "healthy" ] && break
            sleep 5
          done
          [ "$STATUS" = "healthy" ] || (docker compose logs mysql && exit 1)

      - name: Wait for Kafka healthy
        run: |
          for i in $(seq 1 24); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' infra-kafka-1 2>/dev/null || echo "starting")
            echo "Kafka status: $STATUS (attempt $i)"
            [ "$STATUS" = "healthy" ] && break
            sleep 5
          done
          [ "$STATUS" = "healthy" ] || (docker compose logs kafka && exit 1)

      - name: Verify ops-dashboard /health
        run: |
          sleep 3
          curl -sf http://localhost:3000/health | grep -q '"status"'

      - name: Produce and consume a Kafka test message
        run: |
          docker exec infra-kafka-1 \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create --if-not-exists \
            --topic ci-smoke --partitions 1 --replication-factor 1
          echo '{"ci":"smoke"}' | docker exec -i infra-kafka-1 \
            /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server localhost:9092 --topic ci-smoke
          docker exec infra-kafka-1 \
            /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 \
            --topic ci-smoke --from-beginning \
            --max-messages 1 --timeout-ms 10000

      - name: Tear down
        if: always()
        run: docker compose down -v
